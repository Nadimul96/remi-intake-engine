name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format (Biome)
        run: pnpm exec biome ci .
      - run: pnpm typecheck
      - name: Unit tests (extraction, conflict detection, model grounding)
        run: pnpm test
      - name: Build console
        run: pnpm build

  database:
    name: DB-backed tests (Postgres 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: remi
          POSTGRES_USER: remi
          POSTGRES_PASSWORD: remi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remi -d remi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://remi:remi@127.0.0.1:5432/remi
      S3_BUCKET: remi-ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:db

  extractor:
    name: Extractor (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/extractor
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  images:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build services image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: services
          push: false
      - name: Build console image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: console
          push: false
      - name: Build extractor image
        uses: docker/build-push-action@v7
        with:
          context: services/extractor
          push: false
