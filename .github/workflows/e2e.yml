name: Compose end-to-end

# Runs the README Quickstart on a clean machine and checks what a user would see:
# every service healthy, the demo seeded through the real pipeline, the expected
# conflicts with resolvable citations, the console's pages, a clean restart, and the
# bring-your-own-key fallback when a model key is rejected.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: docker compose up, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Only for scripts/verify-stack.mts, which needs no install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Quickstart, docker compose up --build
        run: |
          echo "LOGS=$RUNNER_TEMP/compose" >> "$GITHUB_ENV"
          LOGS="$RUNNER_TEMP/compose"
          mkdir -p "$LOGS"
          nohup docker compose up --build > "$LOGS/up-first.log" 2>&1 &
          echo $! > "$LOGS/up.pid"
          scripts/wait-for-stack.sh 1500

      - name: Seed processed every demo file with no failed runs
        run: docker compose logs --no-log-prefix seed | tee /dev/stderr | grep -qF "Processed 22 file(s), 0 failed"

      - name: Conflicts, provenance and pages through the console port
        run: node scripts/verify-stack.mts

      - name: Restart, docker compose down then up again
        run: |
          docker compose down
          while kill -0 "$(cat "$LOGS/up.pid")" 2>/dev/null; do sleep 1; done
          nohup docker compose up --build > "$LOGS/up-restart.log" 2>&1 &
          echo $! > "$LOGS/up.pid"
          scripts/wait-for-stack.sh 600

      - name: Restart is idempotent
        run: |
          docker compose logs --no-log-prefix seed | tee /dev/stderr | grep -qF "Demo files already ingested"
          node scripts/verify-stack.mts

      - name: Bring your own key, a rejected Gemini key falls back to rules
        env:
          MODEL_EXTRACTION: gemini
          GEMINI_API_KEY: e2e-placeholder-not-a-real-key
        run: |
          docker compose up --detach --no-deps worker
          scripts/wait-for-stack.sh 180
          node scripts/verify-stack.mts --model-fallback
          docker compose logs --no-log-prefix worker > "$LOGS/worker-byok.log"
          grep -F "Model-assisted extraction" "$LOGS/worker-byok.log" || true
          grep -qF "Model-assisted extraction: gemini" "$LOGS/worker-byok.log"
          count="$(grep -c "Model-assisted extraction disabled: gemini rejected the API key" "$LOGS/worker-byok.log" || true)"
          if [[ "$count" != "1" ]]; then
            echo "::error::Expected exactly one auth error in the worker log, saw $count"
            exit 1
          fi
          if grep -qF "$GEMINI_API_KEY" "$LOGS/worker-byok.log"; then
            echo "::error::The worker logged the API key"
            exit 1
          fi

      - name: Compose state and logs
        if: failure()
        run: |
          docker compose ps --all | tee "$LOGS/ps.txt"
          docker compose logs --no-color --timestamps > "$LOGS/all-services.log" 2>&1 || true
          for service in postgres temporal storage extractor migrate api worker seed console; do
            echo "::group::$service"
            docker compose logs --no-color --timestamps --tail 400 "$service" || true
            echo "::endgroup::"
          done

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: ${{ runner.temp }}/compose
          retention-days: 7
