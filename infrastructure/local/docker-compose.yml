services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: remi
      POSTGRES_PASSWORD: remi
      POSTGRES_USER: remi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remi -d remi"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
      POSTGRES_PWD: remi
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: remi
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/remi-dev-password
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-data:/data

  valkey:
    image: valkey/valkey:8.1.1
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  createbuckets:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/remi-dev;
      exit 0;
      "

volumes:
  minio-data:
  neo4j-data:
  postgres-data:
