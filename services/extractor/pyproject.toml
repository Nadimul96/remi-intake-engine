[project]
name = "remi-extractor"
version = "0.2.0"
description = "Type sniffing and normalization service for the REMI intake engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "openpyxl>=3.1.5",
  "pypdf>=6.20.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
